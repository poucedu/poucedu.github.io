<body>
    <!-- 添加制作者信息 -->
    <div class="maker-info">制作者：<a href="https://poucedu.GitHub.io" target="_blank">HYP</a></div>

    <div class="modal" id="archive-modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 class="modal-title">存档管理</h2>
            
            <div class="archive-list" id="archive-list">
                <!-- 存档列表将通过JS动态生成 -->
            </div>
            
            <div class="new-archive-section">
                <h3 class="new-archive-title">创建新存档</h3>
                <form class="new-archive-form">
                    <input type="text" id="new-archive-name" placeholder="输入存档名称">
                    <button type="button" id="create-archive-btn">创建</button>
                </form>
            </div>

    <script>
        // 存档管理核心类保持不变
        class ArchiveManager {
            constructor(storageKey = 'ancientChineseQuizArchives') {
                this.storageKey = storageKey;
                this.currentArchiveId = null;
                this.init();
            }

            init() {
                const archives = this.getAllArchives();
                if (archives.length > 0 && !this.currentArchiveId) {
                    this.currentArchiveId = archives[0].id;
                }
            }

            generateId() {
                return Date.now().toString(36) + Math.random().toString(36).substring(2, 8);
            }

            getAllArchives() {
                try {
                    const stored = localStorage.getItem(this.storageKey);
                    return stored ? JSON.parse(stored) : [];
                } catch (e) {
                    console.error('获取存档失败:', e);
                    return [];
                }
            }

            saveArchives(archives) {
                try {
                    localStorage.setItem(this.storageKey, JSON.stringify(archives));
                    return true;
                } catch (e) {
                    console.error('保存存档失败:', e);
                    return false;
                }
            }

            createArchive(name, questionData) {
                const newArchive = {
                    id: this.generateId(),
                    name: name || `存档_${new Date().toLocaleString().slice(0, 10)}`,
                    createdAt: new Date().toLocaleString(),
                    updatedAt: new Date().toLocaleString(),
                    questionData: questionData,
                    currentIndex: 0,
                    answeredRecords: []
                };

                const archives = this.getAllArchives();
                archives.push(newArchive);
                this.saveArchives(archives);
                
                this.currentArchiveId = newArchive.id;
                return newArchive;
            }

            loadArchive(archiveId) {
                const archives = this.getAllArchives();
                const archive = archives.find(a => a.id === archiveId);
                
                if (archive) {
                    this.currentArchiveId = archiveId;
                    return {
                        questionData: archive.questionData,
                        currentIndex: archive.currentIndex,
                        answeredRecords: archive.answeredRecords,
                        name: archive.name
                    };
                }
                return null;
            }

            updateCurrentArchive(data) {
                if (!this.currentArchiveId) return false;
                
                const archives = this.getAllArchives();
                const index = archives.findIndex(a => a.id === this.currentArchiveId);
                
                if (index !== -1) {
                    archives[index] = {
                        ...archives[index],
                        ...data,
                        updatedAt: new Date().toLocaleString()
                    };
                    return this.saveArchives(archives);
                }
                return false;
            }

            deleteArchive(archiveId) {
                const archives = this.getAllArchives();
                const newArchives = archives.filter(a => a.id !== archiveId);
                
                if (archiveId === this.currentArchiveId) {
                    this.currentArchiveId = newArchives.length > 0 ? newArchives[0].id : null;
                }
                
                return this.saveArchives(newArchives);
            }

            getCurrentArchiveId() {
                return this.currentArchiveId;
            }

            getCurrentArchiveName() {
                const archives = this.getAllArchives();
                const current = archives.find(a => a.id === this.currentArchiveId);
                return current ? current.name : '未选择';
            }
        }

        // 全局变量
        let archiveManager;
        let currentQuestionData = [];
        let currentIndex = 0;
        let answeredRecords = [];
        let questionBank = [];

        // 三篇文章原文保持不变
        const texts = [
            "六王毕，四海一，蜀山兀，阿房出。覆压三百余里，隔离天日。骊山北构而西折，直走咸阳。二川溶溶，流入宫墙。五步一楼，十步一阁；廊腰缦回，檐牙高啄；各抱地势，钩心斗角。盘盘焉，囷囷焉，蜂房水涡，矗不知其几千万落。长桥卧波，未云何龙？复道行空，不霁何虹？高低冥迷，不知西东。歌台暖响，春光融融；舞殿冷袖，风雨凄凄。一日之内，一宫之间，而气候不齐。妃嫔媵嫱，王子皇孙，辞楼下殿，辇来于秦。朝歌夜弦，为秦宫人。明星荧荧，开妆镜也；绿云扰扰，梳晓鬟也；渭流涨腻，弃脂水也；烟斜雾横，焚椒兰也。雷霆乍惊，宫车过也；辘辘远听，杳不知其所之也。一肌一容，尽态极妍，缦立远视，而望幸焉；有不得见者三十六年。燕赵之收藏，韩魏之经营，齐楚之精英，几世几年，剽掠其人，倚叠如山；一旦不能有，输来其间，鼎铛玉石，金块珠砾，弃掷逦迤，秦人视之，亦不甚惜。嗟乎！一人之心，千万人之心也。秦爱纷奢，人亦念其家。奈何取之尽锱铢，用之如泥沙？使负栋之柱，多于南亩之农夫；架梁之椽，多于机上之工女；瓦缝参差，多于周身之帛缕；直栏横槛多于九土之城郭；钉头磷磷，多于在庾之粟粒；管弦呕哑，多于市人之言语。使天下之人，不敢言而敢怒。独夫之心，日益骄固。戍卒叫，函谷举，楚人一炬，可怜焦土！呜呼！灭六国者六国也，非秦也。族秦者秦也，非天下也。嗟夫！使六国各爱其人，则足以拒秦；使秦复爱六国之人，则递三世可至万世而为君，谁得而族灭也？秦人不暇自哀，而后人哀之；后人哀之而不鉴之，亦使后人而复哀后人也。",
            "某启：昨日蒙教，窃以为与君实游处相好之日久，而议事每不合，所操之术多异故也。虽欲强聒，终必不蒙见察，故略上报，不复一一自辨。重念蒙君实视遇厚，于反覆不宜卤莽，故今具道所以，冀君实或见恕也。盖儒者所争，尤在于名实，名实已明，而天下之理得矣。今君实所以见教者，以为侵官、生事、征利、拒谏，以致天下怨谤也。某则以谓受命于人主，议法度而修之于朝廷，以授之于有司，不为侵官；举先王之政，以兴利除弊，不为生事；为天下理财，不为征利；辟邪说，难壬人，不为拒谏。至于怨诽之多，则固前知其如此也。人习于苟且非一日，士大夫多以不恤国事、同俗自媚于众为善，上乃欲变此，而某不量敌之众寡，欲出力助上以抗之，则众何为而不汹汹然？盘庚之迁，胥怨者民也，非特朝廷士大夫而已；盘庚不为怨者故改其度，度义而后动，是而不见可悔故也。如君实责我以在位久，未能助上大有为，以膏泽斯民，则某知罪矣；如曰今日当一切不事事，守前所为而已，则非某之所敢知。无由会晤，不任区区向往之至！",
            "六国破灭，非兵不利，战不善，弊在赂秦。赂秦而力亏，破灭之道也。或曰：六国互丧，率赂秦耶？曰：不赂者以赂者丧。盖失强援，不能独完。故曰：弊在赂秦也。秦以攻取之外，小则获邑，大则得城。较秦之所得，与战胜而得者，其实百倍；诸侯之所亡，与战败而亡者，其实亦百倍。则秦之所大欲，诸侯之所大患，固不在战矣。思厥先祖父，暴霜露，斩荆棘，以有尺寸之地。子孙视之不甚惜，举以予人，如弃草芥。今日割五城，明日割十城，然后得一夕安寝。起视四境，而秦兵又至矣。然则诸侯之地有限，暴秦之欲无厌，奉之弥繁，侵之愈急。故不战而强弱胜负已判矣。至于颠覆，理固宜然。古人云：“以地事秦，犹抱薪救火，薪不尽，火不灭。”此言得之。齐人未尝赂秦，终继五国迁灭，何哉？与嬴而不助五国也。五国既丧，齐亦不免矣。燕赵之君，始有远略，能守其土，义不赂秦。是故燕虽小国而后亡，斯用兵之效也。至丹以荆卿为计，始速祸焉。赵尝五战于秦，二败而三胜。后秦击赵者再，李牧连却之。洎牧以谗诛，邯郸为郡，惜其用武而不终也。且燕赵处秦革灭殆尽之际，可谓智力孤危，战败而亡，诚不得已。向使三国各爱其地，齐人勿附于秦，刺客不行，良将犹在，则胜负之数，存亡之理，当与秦相较，或未易量。呜呼！以赂秦之地封天下之谋臣，以事秦之心礼天下之奇才，并力西向，则吾恐秦人食之不得下咽也。悲夫！有如此之势，而为秦人积威之所劫，日削月割，以趋于亡。为国者无使为积威之所劫哉！夫六国与秦皆诸侯，其势弱于秦，而犹有可以不赂而胜之之势。苟以天下之大，下而从六国破亡之故事，是又在六国下矣。"
        ];

        // 句子拆分和题目生成函数保持不变
        function splitSentences(text) {
            const regex = /([^。！？；：，]+[。！？；：，])/g;
            const sentences = text.match(regex) || [];
            return sentences.map(s => s.trim()).filter(s => s.length > 0);
        }

        function createQuestionBank() {
            const textSentences = texts.map(text => splitSentences(text));
            const groups = [];
            const usedSents = new Set(); 

            textSentences.forEach((sentences, textIndex) => {
                for (let i = 0; i < sentences.length - 1; i++) {
                    const first = sentences[i];
                    if (!first.endsWith('，') || usedSents.has(first)) continue;

                    const second = sentences[i + 1];
                    if (usedSents.has(second)) continue;

                    const source = textIndex === 0 ? '《阿房宫赋》' : 
                                  textIndex === 1 ? '《答司马谏议书》' : '《六国论》';

                    groups.push({ first, second, source });
                    usedSents.add(first);
                    usedSents.add(second);
                }
            });

            groups.sort(() => Math.random() - 0.5);
            return groups.length > 0 ? groups : [];
        }

        // 重点改进初始化存档系统函数，确保默认存档创建并给出提示
        function initArchiveSystem() {
            // 生成题目库
            questionBank = createQuestionBank();
            if (questionBank.length === 0) {
                alert('无法生成题目，请检查原文数据');
                return;
            }
            
            // 初始化存档管理器
            archiveManager = new ArchiveManager();
            
            // 检查是否有现有存档
            const archives = archiveManager.getAllArchives();
            let createdDefault = false;
            
            // 如果没有存档，创建默认存档并提示用户
            if (archives.length === 0) {
                archiveManager.createArchive('默认存档', questionBank);
                createdDefault = true;
            }
            
            // 加载当前存档
            loadCurrentArchive();
            
            // 如果是首次使用并创建了默认存档，显示提示
            if (createdDefault) {
                alert('首次使用，已为您自动创建默认存档！');
            }
            
            // 绑定存档管理事件
            bindArchiveEvents();
        }

        // 其他函数保持不变，但确保存档加载逻辑更可靠
        function loadCurrentArchive() {
            // 强制获取当前存档ID，确保有值
            let archiveId = archiveManager.getCurrentArchiveId();
            const archives = archiveManager.getAllArchives();
            
            // 如果没有当前存档ID但有存档，使用第一个存档
            if (!archiveId && archives.length > 0) {
                archiveId = archives[0].id;
                archiveManager.currentArchiveId = archiveId;
            }
            
            if (archiveId) {
                const archiveData = archiveManager.loadArchive(archiveId);
                if (archiveData) {
                    currentQuestionData = archiveData.questionData;
                    currentIndex = archiveData.currentIndex;
                    answeredRecords = archiveData.answeredRecords;
                    
                    document.getElementById('current-archive').textContent = 
                        `当前存档: ${archiveData.name}`;
                    
                    showCurrentQuestion();
                    renderAnswerRecords();
                    return true;
                }
            }
            
            // 如果所有方法都失败，强制创建新的默认存档
            alert('检测到存档异常，为您重新创建默认存档');
            archiveManager.createArchive('默认存档', questionBank);
            loadCurrentArchive();
            return false;
        }

        function saveCurrentState() {
            if (!archiveManager.getCurrentArchiveId()) return;
            
            archiveManager.updateCurrentArchive({
                currentIndex: currentIndex,
                answeredRecords: [...answeredRecords]
            });
        }

        function bindArchiveEvents() {
            document.getElementById('archive-manager-btn').addEventListener('click', () => {
                document.getElementById('archive-modal').style.display = 'flex';
                renderArchiveList();
            });
            
            document.querySelector('.close-modal').addEventListener('click', () => {
                document.getElementById('archive-modal').style.display = 'none';
            });
            
            document.getElementById('create-archive-btn').addEventListener('click', () => {
                const archiveName = document.getElementById('new-archive-name').value.trim() || 
                                  `新存档_${new Date().toLocaleDateString()}`;
                
                const newQuestionBank = createQuestionBank();
                archiveManager.createArchive(archiveName, newQuestionBank);
                renderArchiveList();
                document.getElementById('new-archive-name').value = '';
                loadCurrentArchive();
                alert('新存档创建成功！');
            });
            
            window.addEventListener('click', (e) => {
                if (e.target === document.getElementById('archive-modal')) {
                    document.getElementById('archive-modal').style.display = 'none';
                }
            });
        }

        function renderArchiveList() {
            const archiveListEl = document.getElementById('archive-list');
            const archives = archiveManager.getAllArchives();
            
            if (archives.length === 0) {
                archiveListEl.innerHTML = '<p>暂无存档</p>';
                return;
            }
            
            let html = '';
            archives.forEach(archive => {
                const isCurrent = archive.id === archiveManager.getCurrentArchiveId();
                html += `
                    <div class="saved-archive-item ${isCurrent ? 'current' : ''}">
                        <div class="archive-info">
                            <div class="archive-name">${archive.name}</div>
                            <div class="archive-meta">
                                创建: ${archive.createdAt}<br>
                                更新: ${archive.updatedAt}
                            </div>
                        </div>
                        <div class="archive-actions">
                            <button class="load-btn" data-id="${archive.id}">加载</button>
                            <button class="delete-btn" data-id="${archive.id}">删除</button>
                        </div>
                    </div>
                `;
            });
            
            archiveListEl.innerHTML = html;
            
            document.querySelectorAll('.load-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    archiveManager.currentArchiveId = btn.getAttribute('data-id');
                    loadCurrentArchive();
                    document.getElementById('archive-modal').style.display = 'none';
                });
            });
            
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (confirm('确定要删除这个存档吗？')) {
                        const wasLastArchive = archiveManager.getAllArchives().length === 1;
                        archiveManager.deleteArchive(btn.getAttribute('data-id'));
                        
                        // 如果删除了最后一个存档，自动创建新的默认存档
                        if (wasLastArchive) {
                            archiveManager.createArchive('默认存档', createQuestionBank());
                            alert('已删除最后一个存档，自动创建新的默认存档');
                        }
                        
                        renderArchiveList();
                        loadCurrentArchive();
                    }
                });
            });
        }

        function showCurrentQuestion() {
            if (!currentQuestionData || currentQuestionData.length === 0) return;
            
            document.querySelector('.total-questions').textContent = `共 ${currentQuestionData.length} 题`;
            
            const current = currentQuestionData[currentIndex];
            document.querySelector('.question-number').textContent = `第 ${currentIndex + 1} 题`;
            document.querySelector('.question-content').textContent = `${current.first} —— ${current.source}`;
            document.querySelector('.answer-content').textContent = current.second;
            document.querySelector('.answer-content').style.display = 'none';
            document.getElementById('show-answer-btn').disabled = false;
        }

        function updateButtonStates() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            if (!currentQuestionData) {
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                return;
            }
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === currentQuestionData.length - 1;
        }

        function addAnswerRecord() {
            if (!currentQuestionData || currentIndex >= currentQuestionData.length) return;
            
            const current = currentQuestionData[currentIndex];
            const record = {
                number: currentIndex + 1,
                first: current.first,
                second: current.second,
                source: current.source,
                time: new Date().toLocaleString()
            };

            const isDuplicate = answeredRecords.some(item => item.number === record.number);
            if (!isDuplicate) {
                answeredRecords.push(record);
                renderAnswerRecords();
                saveCurrentState();
            }
        }

        function renderAnswerRecords() {
            const archiveContentEl = document.getElementById('archive-content');
            if (!answeredRecords || answeredRecords.length === 0) {
                archiveContentEl.textContent = '暂无答题记录';
                return;
            }

            let html = '';
            answeredRecords.forEach(item => {
                html += `
                    <div class="archive-item">
                        <p><strong>第 ${item.number} 题</strong>（${item.time} · ${item.source}）</p>
                        <p>题目：${item.first}</p>
                        <p>答案：${item.second}</p>
                    </div>
                `;
            });
            archiveContentEl.innerHTML = html;
        }

        function bindQuestionNavigationEvents() {
            document.getElementById('prev-btn').addEventListener('click', () => {
                if (currentIndex > 0) {
                    currentIndex--;
                    showCurrentQuestion();
                    updateButtonStates();
                    saveCurrentState();
                }
            });

            document.getElementById('show-answer-btn').addEventListener('click', () => {
                if (!currentQuestionData || currentIndex >= currentQuestionData.length) return;
                
                document.querySelector('.answer-content').style.display = 'block';
                document.getElementById('show-answer-btn').disabled = true;
                addAnswerRecord();
            });

            document.getElementById('next-btn').addEventListener('click', () => {
                if (currentIndex < currentQuestionData.length - 1) {
                    currentIndex++;
                    showCurrentQuestion();
                    updateButtonStates();
                    saveCurrentState();
                }
            });
        }

        function initApp() {
            initArchiveSystem();
            bindQuestionNavigationEvents();
        }

        window.onload = initApp;
    </script>
</body>
</html>
